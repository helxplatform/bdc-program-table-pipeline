name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to containers.renci.org
        uses: docker/login-action@v3
        with:
          registry: containers.renci.org
          username: ${{ secrets.RENCI_REGISTRY_USERNAME }}
          password: ${{ secrets.RENCI_REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            containers.renci.org/helxplatform/bdc-program-table-pipeline:latest
            containers.renci.org/helxplatform/bdc-program-table-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
