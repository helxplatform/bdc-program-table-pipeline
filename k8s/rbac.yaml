# ServiceAccount in ykale namespace — used by the CronJob pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: program-table-sa
  namespace: ykale
---
# Role in bdc-search-dev — grants permissions for helm upgrade of the search release.
# Helm needs GET on all resource types it manages (to diff before applying).
# Only ConfigMaps/Secrets/Deployments are actually written; the rest are read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: program-table-deployer
  namespace: bdc-search-dev
rules:
  # Helm stores release state as secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # ConfigMaps (program table lives here)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Helm needs to GET serviceaccounts to diff them (airflow creates these)
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Services, PVCs, endpoints
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "endpoints"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Pods (for rollout status)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Deployments, StatefulSets, ReplicaSets (airflow uses StatefulSets)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "create", "update", "patch", "watch"]
  # RBAC resources created by airflow subchart
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Ingresses
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
  # PodDisruptionBudgets
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "create", "update", "patch"]
  # HorizontalPodAutoscalers
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "create", "update", "patch"]
  # ServiceMonitors (if Prometheus is installed)
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "list", "create", "update", "patch"]
---
# RoleBinding in bdc-search-dev
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: program-table-deployer-binding
  namespace: bdc-search-dev
subjects:
  - kind: ServiceAccount
    name: program-table-sa
    namespace: ykale
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: program-table-deployer
