# ServiceAccount in ykale namespace — used by the CronJob pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: program-table-sa
  namespace: ykale
---
# Role in bdc-search-dev — grants access to run helm upgrade for the search release
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: program-table-deployer
  namespace: bdc-search-dev
rules:
  # Helm stores release state as secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # ConfigMaps managed by the search chart
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Services managed by the search chart
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  # PersistentVolumeClaims managed by the search chart
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Deployments managed by the search chart
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "watch"]
  # Ingresses managed by the search chart
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch"]
---
# RoleBinding in bdc-search-dev — binds the ykale ServiceAccount to the Role above
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: program-table-deployer-binding
  namespace: bdc-search-dev
subjects:
  - kind: ServiceAccount
    name: program-table-sa
    namespace: ykale
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: program-table-deployer
