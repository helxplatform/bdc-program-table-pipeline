apiVersion: batch/v1
kind: CronJob
metadata:
  name: program-table-pipeline
  namespace: ykale
spec:
  # Runs 1st of every month at 9am UTC
  # To trigger manually:
  #   kubectl create job --from=cronjob/program-table-pipeline manual-$(date +%Y%m%d) -n ykale
  schedule: "0 9 1 * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: program-table-sa
          restartPolicy: Never
          imagePullSecrets:
            - name: image-pull-secret

          containers:
            - name: program-table-pipeline
              image: containers.renci.org/helxplatform/bdc-program-table-pipeline:latest
              imagePullPolicy: Always

              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  cpu: 500m
                  memory: 2Gi

              # All secrets injected from Kubernetes Secret — never baked into image
              env:
                - name: JIRA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: program-table-secrets
                      key: JIRA_TOKEN
                - name: LAKEFS_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: dug-ingest-secrets
                      key: lakefs-username
                - name: LAKEFS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dug-ingest-secrets
                      key: lakefs-password
                - name: JIRA_URL
                  value: "https://nhlbijira.nhlbi.nih.gov"
                - name: BDC_URL
                  value: "https://search.biodatacatalyst.renci.org/search-api"
                - name: GEN3_URL
                  value: "https://gen3.biodatacatalyst.nhlbi.nih.gov/"
                - name: DEPLOY_NAMESPACE
                  value: "bdc-search-dev"
                - name: LAKEFS_HOST
                  value: "https://lakefs.apps.renci.org"
                - name: LAKEFS_REPO
                  value: "bdc-program-table"
                - name: LAKEFS_BRANCH
                  value: "main"

              # Run pipeline steps 0-2, helm upgrade search release, upload to lakeFS
              command: ["bash", "-c"]
              args:
                - |
                  set -e

                  RUN_DATE=$(date '+%Y_%m_%d')
                  SUMMARY=/tmp/run_summary.txt
                  # Tee all output to summary file
                  exec > >(tee -a "$SUMMARY") 2>&1

                  echo "=== BDC Program Table Pipeline ==="
                  echo "Run date: $(date '+%Y-%m-%d %H:%M:%S UTC')"
                  echo ""

                  echo "=== Starting program table pipeline ==="
                  bash run_pipeline.sh -o /data --skip-deploy

                  echo ""
                  echo "=== Finding latest program table output ==="
                  YAML=$(ls -t /data/*/program_table/program_table_updated_*.yaml 2>/dev/null \
                         | grep -v minified | head -1)
                  if [[ -z "$YAML" ]]; then
                    echo "ERROR: No program table YAML found in /data"
                    exit 1
                  fi
                  echo "Using: $YAML"

                  echo ""
                  echo "=== Comparing with previous run ==="
                  PREV_YAML=$(ls -t /data/*/program_table/program_table_updated_*.yaml 2>/dev/null \
                              | grep -v minified | grep -v "$YAML" | head -1)
                  if [[ -n "$PREV_YAML" ]]; then
                    echo "Previous: $PREV_YAML"
                    python3 /app/diff_runs.py "$PREV_YAML" "$YAML"
                  else
                    echo "No previous run found — this appears to be the first run"
                  fi

                  echo ""
                  echo "=== Generating Helm values override ==="
                  python3 -c "
                  import yaml, json, sys
                  data = yaml.safe_load(open(sys.argv[1]))
                  mappings = data['program_study_mappings']
                  override = {'config': {'program_study_mappings': mappings}}
                  with open('/tmp/program-table-override.yaml', 'w') as f:
                      yaml.dump(override, f, default_flow_style=False, allow_unicode=True)
                  print(f'Entries: {len(mappings)}')
                  " "$YAML"

                  echo ""
                  echo "=== Extracting deployed chart from helm release secret ==="
                  python3 /app/extract_helm_chart.py \
                    --namespace "$DEPLOY_NAMESPACE" \
                    --release search \
                    --output /tmp/search-chart

                  echo ""
                  echo "=== Fetching chart sub-chart dependencies ==="
                  helm repo add helx-charts https://helxplatform.github.io/helm-charts/ 2>/dev/null || true
                  helm repo add airflow-stable https://airflow.apache.org/ 2>/dev/null || true
                  helm repo add elastic https://helm.elastic.co 2>/dev/null || true
                  helm repo add bitnami https://charts.bitnami.com/bitnami 2>/dev/null || true
                  helm repo update
                  # Use 'build' (not 'update') so Chart.lock pins exact deployed versions
                  helm dependency build /tmp/search-chart || helm dependency update /tmp/search-chart

                  echo ""
                  echo "=== Running helm upgrade ==="
                  helm upgrade search /tmp/search-chart \
                    --reuse-values \
                    -f /tmp/program-table-override.yaml \
                    -n "$DEPLOY_NAMESPACE" \
                    --wait \
                    --timeout 120s

                  echo ""
                  echo "=== Verifying ConfigMap entry count ==="
                  kubectl get configmap search-api-program-study-mappings \
                    -n "$DEPLOY_NAMESPACE" \
                    -o jsonpath='{.data.program_study_mappings\.json}' | \
                    python3 -c "import sys,json; d=json.load(sys.stdin); print(f'ConfigMap entries: {len(d)}')"

                  echo ""
                  echo "=== Pipeline complete at $(date '+%Y-%m-%d %H:%M:%S UTC') ==="

                  echo ""
                  echo "=== Uploading to lakeFS ($LAKEFS_REPO/$LAKEFS_BRANCH/$RUN_DATE/) ==="
                  LAKEFS_AUTH="$LAKEFS_USERNAME:$LAKEFS_PASSWORD"
                  LAKEFS_API="$LAKEFS_HOST/api/v1/repositories/$LAKEFS_REPO/branches/$LAKEFS_BRANCH/objects"

                  # Derive base data directory from YAML path
                  DATA_DIR=$(dirname "$(dirname "$YAML")")

                  # Upload program table YAML
                  YAML_FILENAME=$(basename "$YAML")
                  curl -sf -u "$LAKEFS_AUTH" -X POST \
                    "$LAKEFS_API?path=$RUN_DATE/$YAML_FILENAME" \
                    -F "content=@$YAML"
                  echo "Uploaded: $RUN_DATE/$YAML_FILENAME"

                  # Upload Jira mappings CSV
                  JIRA_FILE="$DATA_DIR/jira_program_mappings.csv"
                  if [[ -f "$JIRA_FILE" ]]; then
                    curl -sf -u "$LAKEFS_AUTH" -X POST \
                      "$LAKEFS_API?path=$RUN_DATE/jira_program_mappings.csv" \
                      -F "content=@$JIRA_FILE"
                    echo "Uploaded: $RUN_DATE/jira_program_mappings.csv"
                  fi

                  # Upload BDC studies JSON
                  BDC_FILE="$DATA_DIR/studies_on_bdc_portal/bdc_studies.json"
                  if [[ -f "$BDC_FILE" ]]; then
                    curl -sf -u "$LAKEFS_AUTH" -X POST \
                      "$LAKEFS_API?path=$RUN_DATE/bdc_studies.json" \
                      -F "content=@$BDC_FILE"
                    echo "Uploaded: $RUN_DATE/bdc_studies.json"
                  fi

                  # Upload Gen3 studies JSON
                  GEN3_FILE="$DATA_DIR/studies_on_gen3_portal/raw_studies_on_gen3.json"
                  if [[ -f "$GEN3_FILE" ]]; then
                    curl -sf -u "$LAKEFS_AUTH" -X POST \
                      "$LAKEFS_API?path=$RUN_DATE/raw_studies_on_gen3.json" \
                      -F "content=@$GEN3_FILE"
                    echo "Uploaded: $RUN_DATE/raw_studies_on_gen3.json"
                  fi

                  # Upload run summary (flush tee buffer first)
                  echo "Run uploaded at $(date '+%Y-%m-%d %H:%M:%S UTC')" >> "$SUMMARY"
                  curl -sf -u "$LAKEFS_AUTH" -X POST \
                    "$LAKEFS_API?path=$RUN_DATE/run_summary.txt" \
                    -F "content=@$SUMMARY"
                  echo "Uploaded: $RUN_DATE/run_summary.txt"

                  # Commit the lakeFS objects
                  curl -sf -u "$LAKEFS_AUTH" -X POST \
                    "$LAKEFS_HOST/api/v1/repositories/$LAKEFS_REPO/branches/$LAKEFS_BRANCH/commits" \
                    -H "Content-Type: application/json" \
                    -d "{\"message\": \"Program table pipeline run $RUN_DATE\"}"
                  echo "lakeFS commit done."

              volumeMounts:
                - name: data-pvc
                  mountPath: /data

          volumes:
            - name: data-pvc
              persistentVolumeClaim:
                claimName: program-table-data-pvc
