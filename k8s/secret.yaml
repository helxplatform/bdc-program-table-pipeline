# Apply this manually — never commit actual token values to git
#
# Usage:
#   kubectl create secret generic program-table-secrets \
#     --from-literal=JIRA_TOKEN=<your-jira-pat> \
#     -n ykale
#
# Or apply this file after filling in the base64-encoded value:
#   echo -n 'your-token-here' | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: program-table-secrets
  namespace: ykale
type: Opaque
data:
  JIRA_TOKEN: <base64-encoded-token-here>
